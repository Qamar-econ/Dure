@media (max-width:760px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.sec{padding:16px 14px 18px}.kpi .v{font-size:22px}}

<body class="paper">
<div class="top">
  <a class="brand" href="./" aria-label="Dure — back to the story"><svg viewBox="-2 0 336 130" aria-label="Dure."><text x="0" y="104" font-family="Newsreader" font-size="130" font-weight="680" letter-spacing="-5.8" fill="#1F3A40" style="font-variation-settings:'opsz' 72">Dure</text><g transform="translate(316 89)"><g transform="rotate(-28)"><ellipse rx="11.5" ry="15" fill="#6B4226"/><ellipse cx="-3.6" cy="-4.5" rx="4" ry="6.4" fill="#8F5E38" opacity=".55"/><path d="M0.6 -13.6 C -5.2 -7.4 5.2 -1.6 0 4 C -4.2 8.4 1.2 11.2 0.2 13.8" stroke="#2B180C" stroke-width="2.3" fill="none" stroke-linecap="round"/></g></g></svg></a>
  <h1>Letefoho pool <em>· registry</em></h1>
  <div class="note" id="note">Built from farmers' text messages, eight weeks in June–July 2026. <b>Synthetic data for demonstration</b>: farmers are pseudonymous IDs, villages are real places, all figures are illustrative.</div>
  <div class="sp"></div>
  <button class="btn-ghost" id="csv">Download .csv</button>
  <button class="btn" id="xlsx">Download .xlsx</button>
</div>
<div class="fbar" id="fbar">
  <span class="ref" id="ref">A1</span><span class="fx">fx</span><span class="val" id="val"></span>
  <label>Village <select id="fv"><option value="">All</option></select></label>
  <label>Week <select id="fw"><option value="">All</option></select></label>
  <button class="clr" id="clr">Clear filters</button>
</div>
<main id="main">
  <div class="chart" id="chart"></div>
  <div class="grid" id="grid"></div>
  <div class="brief" id="brief" hidden></div>
</main>
<div class="tabs" id="tabs"></div>
<div class="toast" id="toast"></div>
<script>
const TCH=matchMedia('(pointer:coarse)').matches;   /* phones and tablets: chart labels a size up (desktop unchanged) *//* Dure register: every derived figure is computed here from the raw rows.
   Used by sheet.html (in the browser) and by tools/check_sheet.js (node).
   rescale() puts the synthetic July history on the demo's price level; mergeRun() appends the week
   the visitor just played in the demo (see v2/spec/RUN_SCHEMA.md) as the newest pool. */
const DureSheet = (() => {
  const r2 = x => Math.round(x * 100) / 100;
  const med = a => { const s = a.slice().sort((x, y) => x - y); return s.length ? (s.length % 2 ? s[(s.length - 1) / 2] : (s[s.length / 2 - 1] + s[s.length / 2]) / 2) : null; };
  const week = a => Math.floor(a / 2) + 1;           // auctions 0,1 -> week 1 ...
  const pct = (n, d) => d ? Math.round(n / d * 100) : 0;
  // Demo price level: grade B ≈ $2.45/kg. The July history was generated at B ≈ $1.25, so every bid and
  // minimum is multiplied by the same factor; grade weights are unchanged, so who sat out is unchanged.
  const PRICE_K = 1.96;

  function rescale(D, k = PRICE_K) {
    if (D._k) return D;
    D.offers.forEach(o => { o.ask = r2(o.ask * k); });
    D.bids.forEach(b => { b.bid = r2(b.bid * k); if (b.open != null) b.open = r2(b.open * k); });
    D._k = k; return D;
  }

  const SUCO_FIX = { 'katrai leten': 'Katrai Leten', 'letefoho vila': 'Letefoho Vila' };
  const sucoName = s => { if (!s) return 'Letefoho Vila'; const l = String(s).trim().toLowerCase(); return SUCO_FIX[l] || String(s).trim().replace(/\b\w/g, c => c.toUpperCase()); };

  // Append the demo week. Returns a summary used by the page and by the brief generator.
  // demo flags: 'black/mould/insect' from {black, mould, insect, drying, broken} -> the register's vocabulary
  function normFlags(x) {
    if (x == null) return null; const P = new Set(String(x).toLowerCase().split(/[\/,\s]+/).filter(Boolean)), out = [];
    if (P.has('black') || P.has('mould') || P.has('mold')) out.push('black/mould'); if (P.has('insect')) out.push('insect');
    if (P.has('drying')) out.push('uneven drying'); if (P.has('broken')) out.push('broken beans'); return out.join(', ');
  }
  function mergeRun(D, run) {
    const a = D.auctions.length;
    D.auctions.push(run.date || '2026-10-05');
    const none = !run.res || run.res.none;
    const buyers = (run.buyers || []).map((b, i) => { const id = 'BUY-D' + (i + 1); D.buyers.push({ id, name: b.n + (b.loc ? ', ' + b.loc : ''), demo: true }); return { id, ...b }; });
    const winIdx = none ? -1 : typeof run.res.winner === 'number' ? run.res.winner : buyers.findIndex(b => b.n === run.res.winner);
    const winner = winIdx >= 0 && buyers[winIdx] ? buyers[winIdx] : null;
    buyers.forEach((b, i) => {
      const mine = (run.bids || []).filter(x => x.b === i).map(x => x.v);
      if (b.best != null || mine.length) D.bids.push({ auction: a, buyer: b.id, bid: r2(b.best != null ? b.best : Math.max(...mine)), open: mine.length ? r2(Math.min(...mine)) : null, demo: true });
    });
    const F = {}; D.farmers.forEach(f => F[f.id] = f);
    const rows = [];
    (run.farmers || []).forEach((f, i) => {
      if (f.st === 'idle' || !(f.kg > 0)) return;
      const id = f.me ? 'LTF-041' : 'LTF-' + String(200 + (f.pid != null ? +f.pid : typeof f.id === 'number' ? f.id : i)).padStart(3, '0');
      const village = sucoName(f.suco);
      if (F[id]) F[id].village = village;   // Noor keeps her register ID; the village is where she delivered this week
      else { const nf = { id, village, ha: null, tet: f.lang === 'tet', consent: 'N', demo: true }; D.farmers.push(nf); F[id] = nf; }
      const grade = f.handG || f.g || f.aiG || 'B', photo = f.held ? null : (f.aiG || null);
      const sold = !none && f.st === 'in' && f.dec !== 'no' && f.dec !== 'unsold';
      const status = none ? 'no sale' : sold ? 'in' : f.dec === 'no' ? 'declined' : 'sat out';
      const price = none ? null : (run.res.gp && run.res.gp[grade] != null ? r2(run.res.gp[grade]) : null);
      const kgD = sold ? (f.kgD != null ? f.kgD : f.kg) : 0;
      const pay = sold ? (f.pay != null ? r2(f.pay) : r2(kgD * (price || 0))) : 0;
      const o = { auction: a, date: D.auctions[a], farmer: id, kg: f.kg, ask: f.any ? 0 : r2(f.ask || 0), any: !!f.any,
        ai_grade: photo, conf: f.conf != null ? Math.round(f.conf) : null, flags: normFlags(f.flags), grade,
        read_by: f.lang === 'tet' ? 'model' : 'rules', lang: f.lang === 'tet' ? 'TET' : 'EN', on_time: sold ? f.onTime !== false : null,
        run: true, me: !!f.me, name: f.name || id,
        fixed: { price: sold ? price : (none ? null : price), status, paid: pay, buyer: sold && winner ? winner.id : '', kg_del: kgD },
        x: { held: !!f.held, mismatch: !!f.mismatch, aiWrong: !!f.aiWrong, backfill: !!f.backfill, rep: f.rep, rep1: f.rep1, dec: f.dec, st: f.st, woman: f.woman != null ? !!f.woman : (f.sex ? f.sex === 'f' : null) } };
      D.offers.push(o); rows.push(o);
    });
    const bidsN = buyers.filter(b => b.best != null).length;
    D.fixedMarket = D.fixedMarket || {};
    D.fixedMarket[a] = { none, best_bid: none ? null : r2(run.res.p), buyer: winner ? winner.id : '', bids: bidsN,
      open: (run.bids || []).length ? r2(Math.min(...run.bids.map(b => b.v))) : null,
      A: none ? null : r2(run.res.gp.A), B: none ? null : r2(run.res.gp.B), C: none ? null : r2(run.res.gp.C),
      weather: (run.cond && run.cond.rain) || '', road: (run.cond && run.cond.road) || '', invited: (run.cond && run.cond.nB) || buyers.length,
      buyer_paid: run.paid != null ? r2(run.paid) : null };
    D.run = { auction: a, week: week(a), run, buyers, winner, none };
    return D.run;
  }

  function compute(D) {
    const F = {}; D.farmers.forEach(f => F[f.id] = f);
    const nA = Math.max(...D.offers.map(o => o.auction)) + 1;
    const market = [];
    const trades = D.offers.map((o, i) => ({ ...o, row: i, village: F[o.farmer].village }));
    const rain = D.rain || [];
    for (let a = 0; a < nA; a++) {

      if (bf) add('backfill', null, [bf], bf * 12, 0, `${bf} offers added from the waiting list to fill the lot`, { n: bf });
      const late = IN.filter(t => t.on_time === false).length;
      if (IN.length) add('late', null, [late, IN.length], late * 16, 0, `${late} of ${IN.length} deliveries late for the Thursday pickup`, { late, of: IN.length });
      const up = IN.filter(t => t.x.rep1 != null && t.x.rep != null && t.x.rep1 > t.x.rep).length, dn = RW.filter(t => t.x.rep1 != null && t.x.rep != null && t.x.rep1 < t.x.rep).length;
      add('rep', null, [up, dn], 5 + dn * 5, 0, `Reputation scores: up for ${up} farmers, down for ${dn}`, { up, dn });
      const wm = RW.filter(t => t.x.woman != null);
      if (wm.length >= 4) { const n = wm.filter(t => t.x.woman).length, p = pc(n, wm.length);
        add('women', null, [p, n, wm.length], p < 30 ? 50 : 5, 0, `Women farmers: ${n} of ${wm.length} in the lot (${p}%)`, { p, n, of: wm.length }); }
      const tet = pc(RW.filter(t => t.lang === 'TET').length, RW.length);
      add('tetum', null, [tet], 3, 0, `${tet}% of this week's texts in Tetum`, { p: tet });
    }
    const reg = R.register, cons = reg.filter(r => r.consent === 'Y').length;
    add('register', null, [reg.length, cons], 2, 0, `${reg.length} farmers in the registry; ${cons} agreed to be named to the ministry`, { n: reg.length, c: cons });
    return { F, W, BW, villages: V, run };
  }

  /* ------------------------------------------------------------------ phrase bank (hand-written) */
  // {slot} = a value from the finding. Variants are grouped by the finding's direction: u(p), d(own), f(lat), or a (any).
  const BANK = {
    mould: 0, insect: 0, drying: 0,   // set below (shared "defect" bank)
    defect: {

      d: ['{v}: photos flagged {label} fell to {cur}% in week {w}, from {base}% in week {bw}.',

      d: ['{v}: grade C fell to {cur}% of offers in week {w}, from {base}% in week {bw}.',

          '{v} had less grade C coffee in week {w}: {cur}% of offers, against {base}% in week {bw}.',

      f: ['{v}: grade C stayed at {cur}% of offers in week {w}.',

    gradeCnew: { a: ['{v} is new in the registry this week: {cur}% of its {n} offers were grade C.',

      d: ["{v}'s farms offered {cur} kg each in week {w}, {chg}% less than in week {bw}.",

      f: ["{v}'s farms offered {cur} kg each in week {w}, about the same as in week {bw}.",
          'In {v}, offers averaged {cur} kg in week {w}, close to the {base} kg of week {bw}.'] },
    satout: { a: ["{so} of {v}'s {of} offers sat out in week {w}: the minimum was above the price for the grade.",
          'In {v}, {so} of {of} offers sat out in week {w}.',

    lot: {
      u: ['The lot cleared at {p}/kg, up from {prev} at {prevWhen}.',

    buyers: {

      u: ['{nb} of {inv} invited buyers bid this week, more than the {pb} at {prevWhen}.', '{nb} buyers bid this week, against {pb} at {prevWhen}.'],
      f: ['{nb} of {inv} invited buyers placed a bid, as many as at {prevWhen}.', '{nb} buyers bid, the same number as at {prevWhen}.'] },
    cond: { a: ['Weather this week: {rainT}; the road to the pickup point was {roadT}.',
          'The week brought {rainT}, and the pickup road was {roadT}.',

    rainhist: { a: ['Rain fell {r0} to {r1} July, in week {rw}, from the pool records.'] },
    photo: { a: ['The photo grade matched the hand check on {ag} of {of} offers ({p}%).',

          '{held} photos were held for a person to look at; on the rest, photo and hand check agreed {ag} times out of {of}.'] },
    reader: { a: ['The text reader read {right} of {read} messages right first time and asked back {asked} times.',
          '{asked} follow-up questions went out; {right} of {read} messages were read right first time.'] },
    noor: { a: ['{name} sold {kgD} kg of grade {g} at {price}/kg, {pos} the morning band of {lo} to {hi}.',
          "{name}'s {kgD} kg cleared at {price}/kg (grade {g}); the morning band was {lo} to {hi}. Payment: {pay}.",
          '{name} was paid {pay} for {kgD} kg of grade {g}, at {price}/kg.',
          '{name} delivered {kgD} kg on Thursday; grade {g} paid {price}/kg, {pos} the morning band.'] },
    noorOut: { a: ['{name} offered {kg} kg with a minimum of {ask}/kg; grade {g} paid {price}, and the offer was not sold.',
          '{name} kept {kg} kg this week: the grade {g} price was {price}, against a minimum of {ask}.'] },
    noorNone: { a: ["{name}'s {kg} kg was part of the lot that did not clear.", '{name} offered {kg} kg; with no sale this week, the coffee stays with the farm.'] },
    mismatch: { a: ['Photo and hand check disagreed on {n} of {of} delivered bags; the hand-check grade was paid.',
          'On {n} of {of} bags, the hand check gave a different grade from the photo.'] },
    backfill: { a: ['{n} offers were added from the waiting list to fill the lot.', 'The lot was filled with {n} offers from the waiting list.'] },
    late: { a: ['{late} of {of} deliveries came late for the Thursday pickup.', '{late} of {of} farmers missed the Thursday pickup time.'] },
    rep: { a: ['Reputation scores went up for {up} farmers and down for {dn}.', '{up} farmers gained reputation this week; {dn} lost some.'] },
    women: { a: ['Women were {p}% of the farmers in this week\'s lot ({n} of {of}).'] },
    tetum: { a: ["{p}% of this week's texts were in Tetum."] },
    register: { a: ['{n} farmers are in the registry; {c} agreed to be named to the ministry.'] },
  };
  BANK.mould = BANK.insect = BANK.drying = BANK.defect;

  // Review questions: "Whether …?", no numbers, may propose a cause. need = other finding types it must cite.
  const REVIEW = [
    { on: ['gradeC', 'mould', 'drying', 'insect'], dir: 1, need: 'wet', t: 'Whether the rise in {topic} in {v} was linked to the {rainT} {when}?' },
    { on: ['mould', 'insect', 'drying'], dir: 1, t: 'Whether an extension visit to {v} this week could check the coffee for {topic}?' },
    { on: ['gradeC'], dir: 1, t: 'Whether {v} farmers sorted out defective beans before bagging this week?' },
    { on: ['gradeC'], dir: 1, t: 'Whether {v} farmers had enough tarps and covered space for their coffee this week?' },
    { on: ['mould'], dir: 1, t: 'Whether coffee in {v} is being bagged before it is dry enough to resist mould?' },
    { on: ['kg'], dir: -1, need: 'wet', t: 'Whether the drop in coffee offered in {v} was linked to the {rainT} {when}?' },
    { on: ['kg'], dir: -1, t: 'Whether {v} farmers sold coffee to roadside traders instead of the pool this week?' },
    { on: ['satout'], t: 'Whether the farmers in {v} who sat out set their minimums before seeing the grade prices?' },
    { on: ['buyers'], dir: -1, need: 'badRoad', t: 'Whether buyers stayed away because the road was {roadT}?' },
    { on: ['buyers'], t: 'Whether more buyers would bid if the lot were announced earlier in the week?' },
    { on: ['nosale'], t: 'Whether farmers holding unsold coffee would take a small advance until the next pool?' },
    { on: ['nosale'], need: 'wet', t: 'Whether the {rainT} kept buyers from bidding on the lot?' },
    { on: ['photo', 'mismatch'], t: 'Whether the photo grader is missing defects that the hand check finds?' },
    { on: ['late'], need: 'badRoad', t: 'Whether the {roadT} road made Thursday deliveries late?' },
    { on: ['late'], t: 'Whether a reminder text the evening before would help farmers make the Thursday pickup?' },
    { on: ['noor'], t: "Whether {name}'s price, {pos} the morning band, is usual for grade {g} this season?" },
    { on: ['lot'], dir: -1, t: 'Whether the lower lot price this week reflects the coffee on offer or fewer buyers?' },
    { on: ['women'], t: 'Whether women farmers are reached by the texts as often as men?' },
  ];
  // Policy suggestions: always options to review, never certain; cite the findings they follow from.
  const POLICY = [
    { on: ['mould', 'drying'], dir: 1, kind: 'extension', t: ['Consider sending the extension officer to {v} to check drying tarps and storage.', 'Suggest a drying and storage visit to {v} before the next pickup.'] },
    { on: ['gradeC'], dir: 1, kind: 'extension', t: ['Consider a sorting session in {v} before the next pickup, so fewer bags fall to grade C.', 'Could the cooperative lend tarps in {v} for the coming weeks, to keep more bags out of grade C?'] },
    { on: ['photo', 'mismatch'], kind: 'grader', t: ["Consider retraining the photo grader with this week's hand-check photos.", 'Suggest keeping a hand check at every pickup until photo and hand-check grades agree more often.'] },
    { on: ['buyers', 'nosale'], kind: 'buyers', t: ['Consider inviting more buyers before rainy weeks.', 'Suggest calling the buyers who did not bid, to ask what lot size or timing would bring them in.'] },
    { on: ['nosale'], kind: 'credit', t: ['Consider a small advance for farmers holding unsold coffee until the next pool.'] },
    { on: ['cond'], need: 'badRoad', kind: 'logistics', t: ['Consider moving pickup earlier in the day when the road is {roadT}, or adding a second pickup point.', 'Suggest checking the road on Wednesday and texting farmers a new pickup time if it is {roadT}.'] },
    { on: ['late'], kind: 'logistics', t: ['Consider a reminder text the evening before pickup.'] },
    { on: ['satout', 'gap'], kind: 'market', t: ["Suggest sending farmers in {v} last week's grade prices before they set a minimum.", "Suggest sending farmers last week's grade prices before they set a minimum."] },
    { on: ['kg'], dir: -1, kind: 'extension', t: ['Consider asking farmers in {v} where the rest of their coffee went this week.'] },
    { on: ['women'], kind: 'outreach', t: ['Consider outreach through women\'s groups so more women farmers join the pool.'] },
    { on: ['backfill'], kind: 'reputation', t: ['Suggest checking that farmers added from the waiting list got the pickup time early enough.'] },
  ];
  const TOPIC = { mould: 'mould', insect: 'insect damage', drying: 'uneven drying', gradeC: 'grade C' };

  /* ------------------------------------------------------------------ checker (port of ai/brief/brief.py) */
  const CAUSAL = /\b(because|due to|caused|causing|led to|leads to|result of|as a result|owing to|thanks to|linked to|made)\b/i;
  const ADVICE = /\b(should|must|need to|have to|recommend)\b/i;
  const CERTAIN = /\b(will|must|should|guarantee\w*|certain\w*|definitely|always|never|need to|have to)\b/i;
  const JUDGE = /\b(significant\w*|alarming|indicat\w*|dramatic\w*|worrying|excellent|terrible|bad|good|poor|great)\b/i;
  const DOWN = /\b(drop|dropped|fell|fall|falls|down|decrease|decreased|lower|less|fewer|declin\w*)\b/i;
  const UPW = /\b(rose|rise|rises|up|increase|increased|higher|more|jump\w*)\b/i;
  const NUM = /(?<![A-Za-z0-9-])-?\$?\d+(?:[.,]\d+)?/g;
  // a question or suggestion about X must cite a finding about X
  const MEASURES = [[/\bmou?ld\w*|\bblack\b/i, ['mould']], [/\binsect\w*/i, ['insect']], [/\bdr(y|ying|ied)\b/i, ['drying', 'mould']], [/\bgrade c\b/i, ['gradeC', 'gradeCnew']],
    [/\bs(at|it|itting) out\b/i, ['satout', 'gap']], [/\bvolume|\bkg\b|\bcoffee offered\b/i, ['kg']], [/\brain\w*|\bweather|\bshowers\b/i, ['cond', 'rainhist']], [/\broad\b/i, ['cond']],
    [/\bbuyers?\b/i, ['buyers', 'nosale', 'lot']], [/\bphoto\w*|\bgrader\b/i, ['photo', 'mismatch']], [/\bunsold\b|\bno sale\b/i, ['nosale']], [/\bwomen\b/i, ['women']], [/\blate\b|\breminder\b/i, ['late']]];
  const numbers = s => (s.replace(/\bF\d+\b/g, '').match(NUM) || []).map(x => parseFloat(x.replace('$', '').replace(',', '.'))).filter(x => isFinite(x));

  function makeChecker(F, villages) {
    const FIND = {}; F.forEach(f => FIND[f.id] = f);
    const VW = new Set(villages.flatMap(v => v.split(' ')).concat(['Letefoho', 'Ermera', 'Dili', 'Gleno', 'Photo', 'Also']));
    const knownPlace = w => VW.has(w);
    return function check(text, cite, where) {
      const bad = [], review = where === 'review', policy = where === 'policy';
      if (!text || !text.trim()) return ['empty'];
      cite = (cite || []).filter(c => typeof c === 'string');
      const unknown = cite.filter(c => !FIND[c]); if (unknown.length) bad.push('cites findings that do not exist (' + unknown.join(', ') + ')');
      if (!cite.length) bad.push('cites no finding');
      const C = cite.filter(c => FIND[c]).map(c => FIND[c]);
      if (JUDGE.test(text)) bad.push('judgement word ("' + text.match(JUDGE)[0] + '")');
      for (const w of text.match(/\b[A-Z][a-z]{3,}\b/g) || []) if (/(u|o|ai|au)$/.test(w) && !knownPlace(w)) bad.push('unknown place ' + w);
      const vs = new Set(C.map(f => f.village).filter(Boolean));
      for (const v of villages) if (new RegExp('\\b' + v + '\\b').test(text) && !vs.has(v)) bad.push(`names ${v} without citing a ${v} finding`);
      if (review || policy) {
        if (numbers(text.replace(/\bweek \d+\b/g, '')).length) bad.push('numbers in a ' + (review ? 'review question' : 'suggestion'));
        if (review) { if (ADVICE.test(text)) bad.push('gives advice ("' + text.match(ADVICE)[0] + '")'); if (!/^whether\b/i.test(text.trim())) bad.push('not phrased as a question for an expert'); }
        if (policy) { if (CERTAIN.test(text)) bad.push('sounds certain ("' + text.match(CERTAIN)[0] + '")'); if (!/^(consider|suggest|could)\b/i.test(text.trim())) bad.push('not phrased as a suggestion'); if (CAUSAL.test(text)) bad.push('claims a cause'); }
        const types = new Set(C.map(f => f.type));
        for (const [re, keys] of MEASURES) if (re.test(text) && !keys.some(k => types.has(k))) bad.push(`about "${text.match(re)[0]}" but cites no finding about it`);
        for (const v of vs) if (!text.includes(v)) bad.push(`cites a ${v} finding but names somewhere else`);
        return bad;
      }
      if (CAUSAL.test(text)) bad.push('claims a cause ("' + text.match(CAUSAL)[0] + '")');
      const allowed = C.flatMap(f => f.nums.map(n => Math.abs(+n)));
      for (const n of numbers(text)) if (!allowed.some(a => Math.abs(Math.abs(n) - a) < .006)) bad.push(`number ${n} is not in the findings it cites`);
      const dirs = new Set(C.map(f => f.dir).filter(d => d));
      if (dirs.size === 1 && dirs.has(1) && DOWN.test(text)) bad.push('says it fell; the finding rose');
      if (dirs.size === 1 && dirs.has(-1) && UPW.test(text)) bad.push('says it rose; the finding fell');
      if (!dirs.size && C.length && C.every(f => ['kg', 'gradeC', 'mould', 'insect', 'drying', 'lot', 'buyers'].includes(f.type)) && (DOWN.test(text) || UPW.test(text)) && !/\bup for\b/.test(text)) bad.push('says it moved; the finding did not');
      // grade prices: a sentence about one grade may not quote another grade's price
      const gp = {}; C.forEach(f => (f.text.match(/\b([ABC]) \$(\d+\.\d+)/g) || []).forEach(m => { const [g, v] = m.split(' $'); gp[g] = +v; }));
      const named = new Set((text.match(/\bgrade ([ABC])\b/gi) || []).map(s => s.slice(-1).toUpperCase()));
      if (Object.keys(gp).length && named.size === 1) { const g0 = [...named][0];
        for (const n of numbers(text)) for (const [g, v] of Object.entries(gp)) if (g !== g0 && Math.abs(n - v) < .006 && Math.abs(n - (gp[g0] || -1)) > .006) bad.push(`$${n.toFixed(2)} is the grade ${g} price, not grade ${g0}`); }
      return bad;
    };
  }

  /* ------------------------------------------------------------------ writer */
  const fill = (t, s) => { let ok = true; const out = t.replace(/\{(\w+)\}/g, (_, k) => { const v = s[k]; if (v == null || v === '') { ok = false; return ''; } return String(v); }); return ok ? out : null; };
  const dkey = d => d > 0 ? 'u' : d < 0 ? 'd' : 'f';
  function variants(f) { const B = BANK[f.type]; if (!B) return []; return (B.a || B[dkey(f.dir)] || []).map(t => fill(t, f.slots)).filter(Boolean); }

  function generate(data, opt = {}) {
    const R = data.R, D = data.D, seed = opt.seed != null ? opt.seed : (D.run && D.run.run.seed) || 0;
    const { F, W, BW, villages, run } = findings(R, D);
    const allV = [...new Set(R.signals.map(s => s.village))];
    const check = makeChecker(F, allV);
    const FIND = {}; F.forEach(f => FIND[f.id] = f);
    const meta = { seed, week: W, baseWeek: BW, checked: 0, kept: 0, numbersChecked: 0, removed: [], addedByCode: 0, bankChecked: 0, bankPassed: 0, findings: F };
    // 1) pre-check the whole bank against this week's numbers: a variant that fails is never offered
    const pool = {};
    F.forEach(f => { pool[f.id] = variants(f).filter(t => { meta.bankChecked++; const ok = !check(t, [f.id], 'changed').length; if (ok) meta.bankPassed++; return ok; }); });
    const pickFrom = (arr, key) => arr.length ? arr[Math.floor(rng(hash(seed + ':' + key))() * arr.length)] : null;
    const emit = (text, cite, where, extra) => { if (!text) return null; meta.checked++; meta.numbersChecked += numbers(text).length;
      const why = check(text, cite, where); if (why.length) { meta.removed.push({ where, text, why }); return null; } meta.kept++; return { text, cite, ...extra }; };
    const small = (t, f) => t && f.village && f.slots.n < 5 && !/\{n\}/.test(t) && !new RegExp('\\b' + f.slots.n + ' offers?\\b').test(t) ? t.replace(/\.$/, `. Based on ${f.slots.n} offer${f.slots.n > 1 ? 's' : ''} only.`) : t;
    const say = (f, where) => { const t = small(pickFrom(pool[f.id], f.id), f); return emit(t, [f.id], where, { village: f.village, type: f.type }); };

    const VILL = ['mould', 'insect', 'drying', 'gradeC', 'gradeCnew', 'kg', 'satout'], MKT = ['lot', 'gp', 'gap', 'nosale', 'buyers'];
    const ranked = F.filter(f => f.type !== 'register' && f.type !== 'tetum').slice().sort((a, b) => b.score - a.score || a.id.localeCompare(b.id, 'en', { numeric: true }));
    const top3 = ranked.slice(0, 3).map(f => f.id); meta.top3 = top3;
    // headline: the most unusual finding
    const h = ranked[0], headline = say(h, 'headline');
    // what changed: village findings and the week's own facts, most unusual first, grouped by village
    const used = new Set([h.id]);
    let ch = ranked.filter(f => !MKT.includes(f.type) && !used.has(f.id) && f.score >= 8);
    const vSeen = {}; ch = ch.filter(f => { if (!f.village) return true; vSeen[f.village] = (vSeen[f.village] || 0) + 1; return vSeen[f.village] <= 2; }).slice(0, 5);
    top3.forEach(id => { const f = FIND[id]; if (!used.has(id) && !MKT.includes(f.type) && !ch.includes(f)) ch.push(f); });
    if (run) { const me = F.find(f => /^noor/.test(f.type)); if (me && !used.has(me.id) && !ch.includes(me)) ch.push(me); }
    ch.sort((a, b) => (a.village || '~').localeCompare(b.village || '~') || b.score - a.score);
    const changed = ch.map(f => { used.add(f.id); return say(f, 'changed'); }).filter(Boolean);
    // prices and market
    const mf = ranked.filter(f => MKT.includes(f.type) && !used.has(f.id)), lead = mf.find(f => f.type === 'lot' || f.type === 'nosale');
    const pr = (lead ? [lead] : []).concat(mf.filter(f => f !== lead).slice(0, lead ? 2 : 3)).sort((a, b) => MKT.indexOf(a.type) - MKT.indexOf(b.type));
    const prices = pr.map(f => { used.add(f.id); return say(f, 'prices'); }).filter(Boolean);
    // coverage: the three most unusual findings must reach the reader. If one was dropped, code adds it as computed.
    const cited = new Set([headline, ...changed, ...prices].filter(Boolean).flatMap(x => x.cite));
    top3.forEach(id => { if (!cited.has(id)) { const f = FIND[id]; const x = emit(f.text + '.', [id], 'changed', { village: f.village, type: f.type, by: 'code' }); if (x) { changed.push(x); meta.addedByCode++; } } });
    // review questions and policy suggestions
    const cond = F.find(f => f.type === 'cond' || f.type === 'rainhist');
    const need = r => !r.need || (cond && cond.slots[r.need]);
    const review = [], policy = [], rUsed = new Set(), pUsed = new Set(), kinds = new Set();
    const withCond = (t, cite) => cond && /\b(rain\w*|weather|showers|road)\b/i.test(t) && !cite.includes(cond.id) ? cite.concat([cond.id]) : cite;
    for (const f of ranked) {
      if (review.length >= 3) break;
      const sl = { ...(cond ? cond.slots : {}), ...f.slots, topic: TOPIC[f.type] };
      const opts = REVIEW.map((r, i) => ({ r, i, t: fill(r.t, sl) })).filter(o => o.t && !rUsed.has(o.i) && o.r.on.includes(f.type) && (o.r.dir == null || o.r.dir === f.dir) && need(o.r));
      if (!opts.length) continue;
      const withNeed = opts.filter(o => o.r.need), o = withNeed.length && rng(hash(seed + 'r' + f.id))() < .7 ? withNeed[0] : pickFrom(opts, 'r' + f.id);
      const x = emit(o.t, withCond(o.t, [f.id]), 'review'); if (x) { review.push(x); rUsed.add(o.i); }
    }
    for (const f of ranked) {
      if (policy.length >= 4) break;
      if (f.score < 20 || (f.village && f.slots.n < 3)) continue;
      const sl = { ...(cond ? cond.slots : {}), ...f.slots };
      const opts = POLICY.map((p, i) => ({ p, i, ts: p.t.map(t => fill(t, f.village ? sl : { ...sl, v: null })).filter(Boolean) }))
        .filter(o => o.ts.length && !pUsed.has(o.i) && !kinds.has(o.p.kind + (f.village || '')) && o.p.on.includes(f.type) && (o.p.dir == null || o.p.dir === f.dir) && (!o.p.need || f.slots[o.p.need]));
      if (!opts.length) continue;
      const o = opts[0], t = pickFrom(o.ts, 'p' + f.id);
      const x = emit(t, withCond(t, [f.id]), 'policy', { kind: o.p.kind }); if (x) { policy.push(x); pUsed.add(o.i); kinds.add(o.p.kind + (f.village || '')); }
    }
    return { headline, changed, prices, review, policy, meta };
  }

  const api = { generate, findings, makeChecker, BANK, REVIEW, POLICY };
  root.DureBrief = api;
  if (typeof module !== 'undefined') module.exports = api;
})(typeof window !== 'undefined' ? window : globalThis);

function kpis(){
  const M=R.market,mL=M[M.length-1],mP=M[M.length-2]||mL,isRun=!!mL.run;
  const tw=R.trades.filter(t=>!t.demo&&Math.floor(t.auction/2)+1===mL.week),G2=tw.filter(t=>t.matched!=='held'&&t.ai_grade!=null),ag=G2.filter(t=>t.matched==='yes').length;
  const reg=R.register,named=reg.filter(r=>r.consent==='Y').length;
  const dl=(a,b,f)=>{if(a==null||b==null)return '';const d=a-b;if(Math.abs(d)<.005)return 'same as last pool';return `<span class="${d>0?'up':'dn'}">${d>0?'▲':'▼'} ${f(Math.abs(d))}</span> vs last pool`};
  const K=[
    ['Lot price ('+fd(mL.date)+')',mL.none?'No sale':money(mL.best_bid),mL.none?`${mL.bids} bid${mL.bids===1?'':'s'}, none accepted`:dl(mL.best_bid,mP.best_bid,v=>'$'+v.toFixed(2))],
    ['Grade prices A · B · C',mL.none?'—':`<span style="font-size:.72em">${money(mL.A)} · ${money(mL.B)} · ${money(mL.C)}</span>`,'per kg, paid to farmers'],
    ['kg sold',mL.kg_sold.toLocaleString('en-US'),`of ${mL.kg_offered.toLocaleString('en-US')} kg offered`],
    ['Farms in the lot',`${mL.farms_in}`,`of ${mL.farms} offers · ${mL.sat_out} not sold`],
    ['Buyers bidding',`${mL.bids}`,mL.invited?`of ${mL.invited} invited`:`last pool: ${mP.bids}`],
    ['Paid to wallets','$'+(+mL.paid).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2}),isRun&&mL.weather?`weather: ${mL.weather} · road: ${mL.road}`:'this pool'],
    ['Photo = hand check',G2.length?Math.round(ag/G2.length*100)+'%':'—',`${ag} of ${G2.length} offers${isRun?' this week':''}`],
    ['Farmers in the registry',`${reg.length}`,`${named} named to the ministry`]];
  return `<div class="kpis">${K.map(k=>`<div class="kpi${isRun?' new':''}"><div class="k">${k[0]}</div><div class="v">${k[1]}</div><div class="d">${k[2]}</div></div>`).join('')}</div>`}
function weekTable(){if(!RUN)return '';const rows=weekRows();
  return `<div class="cbox"><h4>This week · from your demo</h4><p class="cap">One row per farmer in the lot, as recorded by the demo. <a data-tab="week" data-f='{}' style="color:var(--rust);cursor:pointer;text-decoration:underline">Open as a sheet ↗</a></p></div><div class="wk"><table><thead><tr><th>Farmer</th><th>Village</th><th>kg</th><th>Photo</th><th>Hand</th><th>Price</th><th>Paid</th><th>Reputation</th><th>On time</th><th>Mismatch</th><th>Lang.</th><th>Outcome</th></tr></thead><tbody>${rows.map(r=>`<tr class="${r.me?'me':''}"><td>${esc(r.name)}${r.me?' (you)':''}</td><td>${esc(r.village)}</td><td class="n">${r.kg_del||r.kg}</td><td>${cell('grade',r.ai_grade,r)}</td><td>${cell('grade',r.grade)}</td><td class="n">${money(r.price)}</td><td class="n">${r.paid?money(r.paid):''}</td><td class="n">${r.rep!=null?r.rep+' → '+r.rep1:''}</td><td>${r.on_time==null?'':r.on_time?'yes':'<span class="fl">late</span>'}</td><td>${r.mm==='yes'?'<span class="fl">yes</span>':r.mm}</td><td>${r.lang}</td><td>${cell('status',r.status)}</td></tr>`).join('')}</tbody></table></div>`}
function renderBrief(){
  const T=R.brief,link=it=>it.tab?`<a data-tab="${it.tab}" data-f='${JSON.stringify(it.f||{})}'>rows ↗</a>`:'';
  const mL=R.market[R.market.length-1];
  const d=RUN?new Date((RUN.date||'2026-10-05')+'T06:00:00'):null;
  const date=RUN?`${DAYS[d.getDay()]} ${d.getDate()} ${MON[d.getMonth()]} ${d.getFullYear()} · week ${W}`:T.date;
  // --- Data (code)
  let h=`<div class="doc wide"><div class="meta">${date} · Letefoho pool · for extension services and the Ministry of Agriculture</div><h2>Daily brief</h2>`;
  if(RUN)h+=`<div class="runbar"><b>This week · from your demo.</b> Week ${W} (${fd(mL.date)}): ${mL.farms} offers, ${mL.none?'no sale':mL.farms_in+' sold'}, ${mL.bids} buyer${mL.bids===1?'':'s'} bidding.</div>`;
  h+=`<section class="sec data"><div class="sech"><h3>The numbers</h3></div>
   ${kpis()}
   <div class="cbox"><h4>Prices per pool</h4><div id="c1"></div></div>
   ${RUN&&RUN.bids&&RUN.bids.length?`<div class="cbox"><h4>Highest bid during your week</h4><div id="c2"></div></div>`:''}
   ${signalsBlock()}</section>`;
  // --- Analysis: one version (rules engine finds and ranks; sentences pre-checked; checker drops any that fail)
  if(!G){$('brief').innerHTML=h+'</div>';chartPrices($('c1'));if($('c2'))chartBids($('c2'));drawSignals();return}
  const A=genItems(),mode='gen';
    const li=a=>a.map(it=>`<li>${it.kind?`<span class="kind">${it.kind}</span>`:''}${esc(it.t)}${link(it)}</li>`).join('');
  const hl=String(A.headline||'').split(/(\$?\d+(?:\.\d+)?%?)/).map((p,i)=>i%2?'<b>'+esc(p)+'</b>':esc(p)).join('');   /* highlight numbers before escaping, so entities like &#39; stay intact */
  h+=`<section class="sec ai"><div class="sech"><h3>What it means</h3></div><p class="byline">Written by Dure AI (rules engine + small AI) from this week's data · checked</p>
   <div class="head">${hl}</div>
   <h3>What changed</h3><ul>${li(A.changed)}</ul>
   <h3>Prices and buyers</h3><ul>${li(A.prices)}</ul>
   <h3>Suggested for expert review</h3><ul class="rev">${A.review.map(it=>`<li>${esc(it.t)}</li>`).join('')}</ul>
   ${A.policy.length?`<h3>Policy options to review</h3><ul class="pol">${li(A.policy)}</ul>`:''}
   <p class="foot">The rules engine picks and ranks this week's changes. Sentences come from a phrase bank tested with the same checker as our small AI model; every number is checked against the tables. Runs in the browser, no server.</p>
  </section></div>`;
  $('brief').innerHTML=h;
  chartPrices($('c1'));if($('c2'))chartBids($('c2'));drawSignals();
  $('brief').querySelectorAll('a[data-tab]').forEach(a=>a.onclick=()=>{const f=JSON.parse(a.dataset.f);go(a.dataset.tab,f)});
}
function go(t,f){
  Object.assign(filt,{village:'',week:'',status:'',matched:'',sales:null});hlRows=null;
  if(f&&Object.keys(f).length){Object.assign(filt,{village:f.village||'',week:f.week?String(f.week):'',status:f.status||'',matched:f.matched||'',sales:f.sales!=null?f.sales:null});
    hlRows=r=>true;toast('Showing the rows behind that line')}
  setTab(t);
}
function setTab(t){tab=t;sortK=null;sel=[0,0];
  $('tabs').querySelectorAll('button').forEach(b=>b.classList.toggle('on',b.dataset.t===t));
  const isB=t==='brief';$('brief').hidden=!isB;$('grid').hidden=isB;$('fbar').style.display=isB?'none':'';
  $('fv').value=filt.village;$('fw').value=filt.week;
  if(isB){$('chart').hidden=true;renderBrief()}else renderGrid();
}
function toast(t){const e=$('toast');e.textContent=t;e.classList.add('on');clearTimeout(e._t);e._t=setTimeout(()=>e.classList.remove('on'),2200)}
let rz;addEventListener('resize',()=>{clearTimeout(rz);rz=setTimeout(()=>{if(tab==='brief')renderBrief();else renderChart()},200)});

/* ---------- tabs, filters ---------- */
$('tabs').innerHTML=ORDER.map(k=>`<button data-t="${k}"${RAW[k]?' class="raw"':''}>${RAW[k]?'<i class="rw">RAW</i>':''}${SPEC[k].label}${SPEC[k].rows?`<span class="cnt">${SPEC[k].rows().length}</span>`:''}</button>`).join('');
$('tabs').querySelectorAll('button').forEach(b=>b.onclick=()=>{hlRows=null;setTab(b.dataset.t)});
R.villages.forEach(v=>$('fv').insertAdjacentHTML('beforeend',`<option>${v}</option>`));
[...new Set(R.market.map(m=>m.week))].forEach(w=>$('fw').insertAdjacentHTML('beforeend',`<option value="${w}">${w}${R.market.some(m=>m.run&&m.week===w)?' (demo)':''}</option>`));
$('fv').onchange=()=>{filt.village=$('fv').value;renderGrid()};$('fw').onchange=()=>{filt.week=$('fw').value;renderGrid()};
$('clr').onclick=()=>{Object.assign(filt,{village:'',week:'',status:'',matched:'',sales:null});hlRows=null;$('fv').value='';$('fw').value='';renderGrid()};

/* ---------- export ---------- */
function aoa(k){const S=SPEC[k];return [S.cols.map(c=>c[1])].concat(S.rows().map(r=>S.cols.map(c=>{const v=r[c[0]];return c[2]==='pool'?v+1:c[2]==='yn'?(v==='Y'?'yes':'no'):c[2]==='buyer'?buyerName(v):v==null?'':v})))}
function briefLines(){
  const L=[['Dure daily brief · Letefoho pool'+(RUN?' · week '+W+' (from the demo)':'')],['Synthetic data for demonstration.'],['']];
  const mL=R.market[R.market.length-1];L.push(['The numbers']);
  L.push([`Lot price: ${mL.none?'no sale':money(mL.best_bid)} · A ${money(mL.A)} B ${money(mL.B)} C ${money(mL.C)} · kg sold ${mL.kg_sold} of ${mL.kg_offered} · farms in ${mL.farms_in} of ${mL.farms} · buyers bidding ${mL.bids} · paid ${money(mL.paid)}`]);L.push(['']);
  let A;if(briefMode==='gen'&&G)A=genItems();else if(briefMode==='ai'&&AIB){const ai=aiItems();A={...ai,review:ai.review.map(t=>({t})),policy:[]}}else{const T=R.brief;A={headline:T.headline,changed:T.changed,prices:T.prices,review:T.review.map(t=>({t})),policy:[]}}
  L.push(['What it means · written by Dure AI (rules engine + small AI), checked']);L.push([A.headline]);
  [['What changed',A.changed],['Prices and buyers',A.prices]].forEach(([h,a])=>{L.push([h]);a.forEach(x=>L.push(['• '+x.t]));L.push([''])});
  L.push(['Suggested for expert review']);A.review.forEach(x=>L.push(['☐ '+x.t]));L.push(['']);
  if(A.policy.length){L.push(['Policy options to review']);A.policy.forEach(x=>L.push(['→ '+x.t]));L.push([''])}
  return L}
$('csv').onclick=()=>{const rows=tab==='brief'?briefLines():aoa(tab);const csv=rows.map(r=>r.map(v=>{const s=String(v);return /[",\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s}).join(',')).join('\n');
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download=`dure-letefoho-${tab}.csv`;a.click()};
$('xlsx').onclick=()=>{
  const run=()=>{const wb=XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(briefLines()),'Daily brief');
    ORDER.filter(k=>k!=='brief').forEach(k=>XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(aoa(k)),SPEC[k].label));
    XLSX.writeFile(wb,'dure-letefoho-registry.xlsx');toast('Workbook downloaded: '+ORDER.length+' sheets')};
  if(window.XLSX)return run();
  const s=document.createElement('script');s.src='https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';
  s.onload=run;s.onerror=()=>toast('Could not load the Excel library. Use .csv instead.');document.head.appendChild(s);toast('Preparing the workbook…')};

setTab(q?'trades':'brief');
if(q){const i=rowsFor('trades').findIndex(r=>r.demo);if(i>=0){sel=[i,0];paintSel();toast("Noor's sale from the demo is in the registry")}}
if(RUN)toast('Your demo week is in the registry');
window.__dure={R:()=>R,G:()=>G,run:RUN};
})();

{const t=document.getElementById('tabs');if(t){const f=()=>t.classList.toggle('end',t.scrollLeft+t.clientWidth>=t.scrollWidth-4);t.addEventListener('scroll',f,{passive:true});addEventListener('resize',f);f()}}
</script>
